<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>YCDC | Yogiraj Centre for Dermatology & Cosmetology</title>
    <meta name="description" content="Experience premium skin, hair, and aesthetic treatments at Yogiraj Centre for Dermatology & Cosmetology (YCDC). Located in Bengaluru and Thiruvananthapuram, led by Dr. K. Yogiraj with 45+ years of excellence." />
    <meta name="keywords" content="YCDC, Yogiraj Dermatology, Skin clinic Bangalore, Skin clinic Trivandrum, hair transplant, laser hair removal, dermatology Thiruvananthapuram, cosmetic clinic, Dr Yogiraj, skin doctor" />
    <meta name="author" content="YCDC Clinic" />

    <!-- Google Fonts: Cormorant Garamond, Manrope, Inter & Caveat (Handwritten Script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YCDCTRACK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YCDCTRACK', { send_page_view: false }); // Disable automatic pageview in SPA, we track manually on route change
    </script>

    <!-- Site preloader: inline so it paints before the app bundle loads; removed in src/main.tsx -->
    <link rel="preload" as="image" href="/ycdc-logo.png" />
    <style>
      html.is-loading { overflow: hidden; }
      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #F7F3ED;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #site-loader.is-hidden { opacity: 0; visibility: hidden; }
      #site-loader img {
        width: min(220px, 56vw);
        height: auto;
        animation: site-loader-breathe 2.4s ease-in-out infinite;
      }
      #site-loader .site-loader-track {
        position: relative;
        width: min(160px, 40vw);
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(83, 107, 76, 0.15);
      }
      #site-loader .site-loader-track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #536B4C, #B49A68);
        animation: site-loader-slide 1.3s ease-in-out infinite;
      }
      @keyframes site-loader-breathe {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes site-loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #site-loader img, #site-loader .site-loader-track::after { animation: none; }
      }
    </style>
    <script>document.documentElement.classList.add('is-loading');</script>
  </head>
  <body>
    <div id="site-loader" role="status" aria-live="polite" aria-label="Loading YCDC">
      <img src="/ycdc-logo.png" alt="YCDC - Dr. Yogiraj Centre for Dermatology & Cosmetology" />
      <div class="site-loader-track"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
